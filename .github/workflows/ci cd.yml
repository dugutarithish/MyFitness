name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false # Set to true if you want to push to Docker Hub / registry
        tags: myfitness:latest
        load: true

    - name: Verify Web Assets
      run: |
        echo "Verifying presence of core web files..."
        test -f index.html || (echo "Error: index.html missing!" && exit 1)
        echo "Build and validation completed successfully!"
